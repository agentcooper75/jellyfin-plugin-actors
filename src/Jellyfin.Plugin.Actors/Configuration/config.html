<div id="actorsConfigPage" data-role="page" class="page type-interior pluginConfigurationPage actorsConfigurationPage" data-controller="__plugin/actors-config.js">
    <style>
        .actors-config { max-width: 720px; padding: 0.5rem 0 1.5rem; }
        .actors-config h2 { margin-top: 0; }
        .actors-config .desc { opacity: 0.8; margin-bottom: 1.25rem; line-height: 1.45; }
        .actors-lib-list { display: flex; flex-direction: column; gap: 0.5rem; margin: 1rem 0 1.5rem; }
        .actors-lib-row {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.75rem 0.9rem; border-radius: 8px;
            background: rgba(255,255,255,0.04); cursor: pointer;
        }
        .actors-lib-row:hover { background: rgba(255,255,255,0.07); }
        .actors-lib-row input[type="checkbox"] {
            width: 1.15rem; height: 1.15rem; flex-shrink: 0; cursor: pointer;
        }
        .actors-lib-row .lib-label { flex: 1; }
        .actors-lib-row .lib-type { opacity: 0.6; margin-left: 0.35rem; }
        .actors-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
        .actors-actions button {
            min-height: 2.4rem; padding: 0.55rem 1rem; border-radius: 6px;
            border: 0; cursor: pointer; font: inherit;
        }
        .actors-actions .primary { background: #00a4dc; color: #fff; }
        .actors-actions .secondary { background: rgba(255,255,255,0.12); color: inherit; }
        .actors-status { margin-top: 1rem; opacity: 0.9; min-height: 1.2em; }
    </style>
    <div data-role="content">
        <div class="content-primary actors-config">
            <h2>Actors</h2>
            <p class="desc">
                Wähle die Libraries, die die Schauspieler-Übersicht füttern.
                Ohne Auswahl bleibt die Übersicht leer — absichtlich, damit Dokus/Kids nicht mitmischen.
            </p>

            <div class="actors-lib-list" id="actorsLibraryList">
                <p>Lade Libraries…</p>
            </div>

            <div class="actors-actions">
                <button type="button" class="primary" id="actorsSaveBtn">Speichern &amp; Index neu aufbauen</button>
                <button type="button" class="secondary" id="actorsOpenBtn">Übersicht öffnen</button>
            </div>
            <div class="actors-status" id="actorsStatus"></div>
        </div>
    </div>
</div>
